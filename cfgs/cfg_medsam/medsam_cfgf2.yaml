model: medsam_adapter
model_kw:
  adapter_dim: 256

loss: mil_prop_bce_entropy_reg
pos_weight: 8.0
treat_gg1_as_benign: false
outside_prostate_penalty: false
add_image_clf: true
image_clf_mode: cspca
add_image_clf_high_vs_low_grade: false
optimizer: adamw
lr: 1.0e-06
encoder_lr: 1.0e-06
warmup_lr: 0.00001
cnn_lr: 1.0e-06
warmup_epochs: 0
wd: 0.0
epochs: 50
accumulate_grad_steps: 1
cutoff_epoch: null
run_test: True
test_every_epoch: false
run_val: true
project: miccai2024_comparison
seed: 30
tracked_metric: linear_probe/macro_auc
save_checkpoint_wandb: false
torch_compile: true
use_amp: true
device: cuda
checkpoint_dir: ${base_dir}/alignUS_propbce/${run_name}/${chkpt_dir} #${base_dir}/${chkpt_dir}
model_checkpoint: null #/home/obed/scratch/ggnus_align/nct_opt_3way_0.2M_0.5H_0/3691219/best.pth
debug: false
save_best_weights: True
evaluator:
  log_images: true
  log_images_every: 100

wandb:
  run_name: ${run_name}
  project: alignUS_propbce
  group: ${run_name}
job_id: 0

