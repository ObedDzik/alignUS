fold: 2
weight: 0.2_H_0.8_M
pr_train_mode: us_histo
train_mode: ${pr_train_mode}
run_name: pnf_${fold}
base_dir: /scratch/obed
chkpt_dir: /${oc.env:JOB_ID} #dummy
model_type: medsam
experiment_type: pnf

histo_emb_dir: /project/6106383/shared/radboud_gigaembeds
mri_emb_dir: /home/obed/projects/aip-medilab/shared/mri_only_embeddings_dino
hist_csv: /project/aip-medilab/shared/metadata_usalign/clean_labels_with_cancer_pct.csv
mri_csv: /project/aip-medilab/shared/picai/manifests/slices_manifest.csv
freeze_encoder: False
restrict_test: False

use_acmil: False
acmil_mask_drop_prob: 0.0
acmil_n_branches: 3
supcon_only: False
propbce: False
loss_type: cancer_det
loss_type_reg: null
lambda_cross: 0.0
lambda_within: 1.0
lambda_mri: 0.0
normalize: False
use_mmd: False
lambda_mmd: 0.0
no_per_grade: 5

data_provider: radboud
proj_dim: 768
hidden_dim: 512
input_dim: 256


lambda_aem: 0.1
lambda_supcon: 0.5    # weight of SupCon relative to MMD
bank_size: 128
neg_strength: 1.0
domain_weight: 1.0
test_tracked_metric: linear_probe/macro_auc
test_save_best_weights: True


data:
  dataset: nct              # anything other than "optimum" uses BModeDatasetV2
  root_dir_c23: /datasets/exactvu_pca/OPTIMUM/processed/UA_annotated_needles   # NeedleTrace root for train/val
  root_dir_c3: /datasets/exactvu_pca/OPTIMUM/UA_OL_PU_annotated_needles_multiframe
  fold: ${fold}
  optimum_center: OL
  n_folds: 5
  test_center: null
  exclude_benign_cores_from_positive_patients: true
  involvement_threshold_pct: null
  undersample_benign_ratio: null
  cohort_selection_mode: kfold
  # dataset: default
  batch_size: 20
  num_workers: 8
  augmentations: translate
  image_size: 512
  first_downsample_size: null
  mask_size: 128 #${data.image_size}
  limit_train_data: null
  mean: [0, 0, 0] 
  std: [1, 1, 1]
  flip_ud: false
  frames: first
  crop_to_prostate: false
  rf_as_bmode: false
  include_rf: false
  train_subsample_seed: 42   #42 
  histo_emb_dir: ${histo_emb_dir}
  mri_emb_dir: ${mri_emb_dir}
  hist_csv: ${hist_csv}
  mri_csv: ${mri_csv}
  hist_data_provider: ${data_provider}
  samples_per_grade: ${no_per_grade}

model: prostnfound_adapter_medsam_legacy
model_kw:
  use_class_decoder: true #false

loss: mil_prop_bce_entropy_reg #inv_mse inv_l1
outside_prostate_penalty: false
add_image_clf: True #False #
image_clf_mode: cspca
optimizer: adamw
lr: 0.00001
encoder_lr: 1.0e-06
warmup_lr: 0.0001
cnn_lr: 1.0e-05
warmup_epochs: 0
wd: 0
epochs: 90
accumulate_grad_steps: 1
cutoff_epoch: null

run_test: false
test_every_epoch: false
run_val: true

project: miccai2024_comparison
seed: 30   #30
# tracked_metric: val/sens_at_60_spe_heatmap_cspca
tracked_metric: linear_probe/macro_auc

save_checkpoint_wandb: false
torch_compile: true
use_amp: true
device: cuda
checkpoint_dir: ${base_dir}/alignUS_propbce/${run_name}/${chkpt_dir} 
model_checkpoint: null
debug: false
save_best_weights: True

evaluator:
  log_images: false
  log_images_every: 100

wandb:
  run_name: ${run_name}
  project: alignUS_propbce
  group: ${run_name}
job_id: 0
